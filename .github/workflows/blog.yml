name: AIOps Blog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aiops-blog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Validate and build static blog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          SITE_URL: https://rengame.github.io
          BASE_PATH: /aiops-daily-blog/
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: npm run format:check
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    name: Deploy reviewed Markdown to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
